name: CompatHelper

# Run by hand (Actions → CompatHelper → Run workflow) when upgrading dependencies. Nemo is pinned
# on purpose, since the kernels call FLINT internals of the pinned version, and Hecke with it.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    steps:
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Install CompatHelper
        run: julia -e 'using Pkg; Pkg.add("CompatHelper")'
      - name: Run CompatHelper
        run: julia -e 'using CompatHelper; CompatHelper.main(; subdirs=["", "docs", "test/oscar"])'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
